<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educa Hortus - Gerador com Mentoria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        .btn-gradient { background: linear-gradient(135deg, #ec4899 0%, #a855f7 100%); transition: all 0.4s ease; }
        .text-marinho { color: #1e3a8a; }
        .sugestao-chip { cursor: pointer; transition: all 0.2s; border: 1px solid #ddd; }
        .sugestao-chip:hover { background-color: #f3e8ff; border-color: #a855f7; color: #a855f7; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900">

    <header class="bg-white border-b-8 border-purple-200 pt-10 pb-12 px-6 text-center">
        <h1 class="text-4xl font-black text-marinho uppercase">Educa <span class="text-pink-500">Hortus</span></h1>
        <p class="text-slate-500 italic">"Sua mentoria pedagógica automatizada."</p>
    </header>

    <main class="max-w-6xl mx-auto -mt-6 px-4 pb-20 grid grid-cols-1 lg:grid-cols-2 gap-8">
        
        <div class="bg-white rounded-[2.5rem] shadow-2xl p-8 border border-purple-50">
            <form id="form-final" class="space-y-6">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="aluno" class="w-full p-4 bg-slate-50 rounded-2xl outline-none" placeholder="Nome do Aluno" oninput="syncPreview()">
                    <input type="text" id="serie" class="w-full p-4 bg-slate-50 rounded-2xl outline-none" placeholder="Série/Ano" oninput="syncPreview()">
                </div>

                <select id="diagnostico" class="w-full p-4 bg-slate-50 rounded-2xl outline-none" onchange="syncPreview()">
                    <option value="">Selecione o Diagnóstico...</option>
                    <option value="TEA">Autismo (TEA)</option>
                    <option value="Altas Habilidades">Altas Habilidades / Superdotação</option>
                    <option value="DI">Deficiência Intelectual</option>
                </select>

                <div>
                    <label class="block text-marinho font-bold mb-2">Habilidades e Potencialidades</label>
                    <textarea id="habilidades" rows="4" class="w-full p-4 bg-slate-50 rounded-2xl outline-none text-sm mb-2" placeholder="O que o aluno já faz?"></textarea>
                    
                    <p class="text-[10px] text-slate-400 mb-2 uppercase font-bold">Sugestões de Especialista:</p>
                    <div class="flex flex-wrap gap-2">
                        <span class="sugestao-chip px-3 py-1 rounded-full text-[10px] bg-white" onclick="inserir('habilidades', 'Demonstra excelente memória visual e interesse engajado por temas específicos.')">Memória Visual</span>
                        <span class="sugestao-chip px-3 py-1 rounded-full text-[10px] bg-white" onclick="inserir('habilidades', 'Realiza pareamento de cores e formas com autonomia e foco.')">Pareamento/Cores</span>
                        <span class="sugestao-chip px-3 py-1 rounded-full text-[10px] bg-white" onclick="inserir('habilidades', 'Possui vocabulário avançado para a idade cronológica e curiosidade investigativa.')">Vocabulário Avançado</span>
                    </div>
                </div>

                <div>
                    <label class="block text-marinho font-bold mb-2">Objetivos (BNCC)</label>
                    <textarea id="objetivos" rows="4" class="w-full p-4 bg-slate-50 rounded-2xl outline-none text-sm mb-2" placeholder="Metas para o semestre..."></textarea>
                    
                    <p class="text-[10px] text-slate-400 mb-2 uppercase font-bold">Sugestões BNCC:</p>
                    <div class="flex flex-wrap gap-2">
                        <span class="sugestao-chip px-3 py-1 rounded-full text-[10px] bg-white" onclick="inserir('objetivos', '(EI03ET07) Relacionar números às suas respectivas quantidades.')">BNCC: Números</span>
                        <span class="sugestao-chip px-3 py-1 rounded-full text-[10px] bg-white" onclick="inserir('objetivos', '(EI03CG02) Demonstrar controle e adequação do uso de seu corpo em brincadeiras.')">BNCC: Corpo</span>
                        <span class="sugestao-chip px-3 py-1 rounded-full text-[10px] bg-white" onclick="inserir('objetivos', 'Ampliar o enriquecimento curricular através de projetos de pesquisa autônomos.')">Enriquecimento (AH)</span>
                    </div>
                </div>

                <button type="button" id="btn-pagar" class="w-full py-5 rounded-2xl text-white font-black text-xl btn-gradient shadow-xl uppercase">
                    Gerar PDF Profissional
                </button>
            </form>
        </div>

        <div class="lg:sticky lg:top-10 h-fit">
            <div class="bg-white rounded-[2.5rem] shadow-xl p-8 border-l-8 border-purple-400">
                <h3 class="text-xl font-black text-marinho mb-4">Seu PEI em tempo real</h3>
                <div id="visualizador" class="space-y-4 text-sm text-slate-600">
                    <p class="font-bold text-lg text-pink-500" id="pre-aluno">Nome do Aluno</p>
                    <p><span class="font-bold text-marinho">Habilidades:</span> <span id="pre-hab">...</span></p>
                    <p><span class="font-bold text-marinho">Objetivos:</span> <span id="pre-obj">...</span></p>
                </div>
            </div>
        </div>
    </main>

    <script>
        function inserir(campoId, texto) {
            const campo = document.getElementById(campoId);
            campo.value += (campo.value ? " " : "") + texto;
            syncPreview();
        }

        function syncPreview() {
            document.getElementById('pre-aluno').innerText = document.getElementById('aluno').value || "Nome do Aluno";
            document.getElementById('pre-hab').innerText = document.getElementById('habilidades').value || "...";
            document.getElementById('pre-obj').innerText = document.getElementById('objetivos').value || "...";
        }
        
        // Mantive a lógica de PDF anterior...
        document.getElementById('btn-pagar').addEventListener('click', () => { alert("Botão clicado! Área de pagamento apareceria aqui."); });
    </script>
</body>
</html>
